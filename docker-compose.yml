services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${DB_USER:-caddy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-caddy}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-caddy} -d ${DB_NAME:-caddy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - web
      - internal
    volumes:
      - api_logs:/repo/logs

  migrate:
    image: masgeek/caddy-manager-migrate:${TAG:-latest}
    container_name: migrate
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrations
    environment:
      DB_USER: ${DB_USER:-caddy}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-caddy}
      SEED_EMAIL: ${SEED_EMAIL:-admin@caddy.local}
      SEED_USERNAME: ${SEED_USERNAME:-admin}
      SEED_PASSWORD: ${SEED_PASSWORD:?SEED_PASSWORD is required}
      SEED_ROLE: ${SEED_ROLE:-admin}
    depends_on:
      db:
        condition: service_healthy
    restart: no
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - web
      - internal

  api:
    image: masgeek/caddy-manager-api:${TAG:-latest}
    container_name: api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 3500
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ${LOG_FILE:-logs/caddy-manager.log}
      SITE_HEALTH_ENABLED: ${SITE_HEALTH_ENABLED:-true}
      SITE_CHECK_CRON: ${SITE_CHECK_CRON:-*/5 * * * *}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CADDY_ADMIN_TOKEN: ${CADDY_ADMIN_TOKEN:-}
      CADDY_ALLOWED_HOSTS: ${CADDY_ALLOWED_HOSTS:?CADDY_ALLOWED_HOSTS is required}
      ALLOW_PRIVATE_OUTBOUND: ${ALLOW_PRIVATE_OUTBOUND:-false}
      DB_USER: ${DB_USER:-caddy}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-caddy}
      SEED_EMAIL: ${SEED_EMAIL:-admin@caddy.local}
      SEED_USERNAME: ${SEED_USERNAME:-admin}
      SEED_PASSWORD: ${SEED_PASSWORD:?SEED_PASSWORD is required}
      SEED_ROLE: ${SEED_ROLE:-admin}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3500/api/health'').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - web
      - internal
    volumes:
      - api_logs:/repo/logs

  web:
    image: masgeek/caddy-manager-web:${TAG:-latest}
    container_name: web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web
      - internal

networks:
  web:
    driver: bridge
  internal:
    driver: bridge

volumes:
  db_data:
  api_logs:
